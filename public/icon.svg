<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glass 3D Jewel Gradients -->
    <linearGradient id="prismBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glassFace" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="glowDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Plate / Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  
  <!-- Outer Neon Halo Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#prismBorder)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- 3D Glass Prism Back Drop Glow -->
  <circle cx="256" cy="220" r="140" fill="#0284c7" opacity="0.25" filter="url(#glowDrop)" />
  <circle cx="340" cy="300" r="110" fill="#8b5cf6" opacity="0.2" filter="url(#glowDrop)" />
  <circle cx="180" cy="320" r="90" fill="#10b981" opacity="0.18" filter="url(#glowDrop)" />

  <!-- 3D Geometric Glass Hexagonal Shield / Jewel -->
  <g filter="url(#softShadow)">
    <polygon points="256,76 404,162 404,334 256,420 108,334 108,162" 
             fill="url(#glassFace)" 
             stroke="url(#prismBorder)" 
             stroke-width="5" 
             stroke-linejoin="round" />

    <!-- Inner Facet Lines for 3D Diamond / Prism Depth -->
    <line x1="256" y1="76" x2="256" y2="420" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
    <line x1="108" y1="162" x2="404" y2="334" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <line x1="404" y1="162" x2="108" y2="334" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Specular Highlight Overlay -->
    <polygon points="256,80 398,164 256,248 114,164" fill="url(#specularGlint)" />
  </g>

  <!-- Center Floating Emblem: Polyglot Linguistic Core -->
  <g id="linguisticCore">
    <!-- Center Myanmar & Mon "က" (Ka - Root of scripts) -->
    <text x="256" y="278" 
          font-family="'Padauk', 'Noto Sans Myanmar', system-ui, sans-serif" 
          font-size="124" 
          font-weight="bold" 
          fill="url(#goldCyan)" 
          text-anchor="middle" 
          filter="url(#glowDrop)">က</text>

    <!-- Top Floating Pali / Sanskrit Sacred Akshara "ॐ / ဓ" -->
    <text x="256" y="145" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#38bdf8" 
          text-anchor="middle" 
          opacity="0.95">ဓမ္မ • SAṂSKṚTA</text>

    <!-- Bottom Tai Shan Emblem -->
    <text x="256" y="385" 
          font-family="'Noto Sans Myanmar', system-ui, sans-serif" 
          font-size="24" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#a78bfa" 
          text-anchor="middle" 
          opacity="0.95">တႆး • MON • VIỆT</text>

    <!-- Left Wing Symbol: "A" (English) -->
    <circle cx="152" cy="248" r="28" fill="rgba(15, 23, 42, 0.7)" stroke="#38bdf8" stroke-width="2" />
    <text x="152" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#e0f2fe" text-anchor="middle">A</text>

    <!-- Right Wing Symbol: "文" / "Tiếng" / "မ" -->
    <circle cx="360" cy="248" r="28" fill="rgba(15, 23, 42, 0.7)" stroke="#a78bfa" stroke-width="2" />
    <text x="360" y="258" font-family="'Noto Sans Myanmar', sans-serif" font-size="22" font-weight="700" fill="#f5d0fe" text-anchor="middle">မ</text>
  </g>

  <!-- Sparkle Stars for 3D AI Magic -->
  <path d="M 210,130 Q 210,145 195,145 Q 210,145 210,160 Q 210,145 225,145 Q 210,145 210,130" fill="#38bdf8" opacity="0.9" />
  <path d="M 320,115 Q 320,126 310,126 Q 320,126 320,137 Q 320,126 330,126 Q 320,126 320,115" fill="#fef08a" opacity="0.85" />
  <path d="M 370,350 Q 370,362 360,362 Q 370,362 370,374 Q 370,362 380,362 Q 370,362 370,350" fill="#34d399" opacity="0.8" />
</svg>
